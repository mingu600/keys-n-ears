<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Practice Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a class="brand" href="#/">Practice Hub</a>
    <span id="midi-status" class="status">Connecting MIDI…</span>
    <div class="controls">
      <select id="input-select" aria-label="MIDI input"></select>
      <select id="output-select" aria-label="Prompts output"></select>
      <details class="genres">
        <summary id="genre-summary">Genres: All</summary>
        <div id="genre-list" class="genre-list"></div>
      </details>
    </div>
  </header>

  <main id="view"></main>

  <script src="https://cdn.jsdelivr.net/npm/tone@15.0.4/build/Tone.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
