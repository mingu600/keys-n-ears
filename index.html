<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keys-n-Ears</title>
  <meta name="theme-color" content="#e3d8fb">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='8' width='26' height='18' rx='4' fill='%23cdb8f0'/%3E%3Crect x='6' y='16' width='20' height='7' rx='1.5' fill='%23fffdfb'/%3E%3Crect x='10' y='16' width='2' height='4' fill='%233f3557'/%3E%3Crect x='15' y='16' width='2' height='4' fill='%233f3557'/%3E%3Crect x='20' y='16' width='2' height='4' fill='%233f3557'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sky" aria-hidden="true">
    <svg class="cloud c1" viewBox="0 0 200 70"><path d="M30 60 Q8 60 10 44 Q12 30 30 32 Q34 12 58 14 Q74 0 96 12 Q122 4 132 26 Q156 20 164 38 Q190 40 186 56 Q184 62 170 62 Z"/></svg>
    <svg class="cloud c2" viewBox="0 0 200 70"><path d="M30 60 Q8 60 10 44 Q12 30 30 32 Q34 12 58 14 Q74 0 96 12 Q122 4 132 26 Q156 20 164 38 Q190 40 186 56 Q184 62 170 62 Z"/></svg>
    <span class="note" style="left:7%;animation-duration:30s;animation-delay:-5s">♪</span>
    <span class="note t" style="left:24%;animation-duration:38s;animation-delay:-19s">♫</span>
    <span class="note" style="left:45%;animation-duration:34s;animation-delay:-11s">♩</span>
    <span class="note t" style="left:68%;animation-duration:41s;animation-delay:-27s">♪</span>
    <span class="note" style="left:88%;animation-duration:36s;animation-delay:-2s">♫</span>
  </div>
  <header>
    <a class="brand" href="#/"><svg class="brand-art" viewBox="0 0 48 48" aria-hidden="true">
      <ellipse cx="22" cy="44" rx="17" ry="2.5" fill="#e0d4f5"/>
      <rect x="5" y="12" width="34" height="30" rx="6" fill="#cdb8f0"/>
      <rect x="5" y="12" width="34" height="7" rx="3.5" fill="#b9a0ea"/>
      <rect x="9" y="25" width="26" height="11" rx="2" fill="#fffdfb"/>
      <rect x="12.5" y="25" width="2.6" height="6" rx="1" fill="#3f3557"/>
      <rect x="17.5" y="25" width="2.6" height="6" rx="1" fill="#3f3557"/>
      <rect x="24.5" y="25" width="2.6" height="6" rx="1" fill="#3f3557"/>
      <rect x="29.5" y="25" width="2.6" height="6" rx="1" fill="#3f3557"/>
      <rect x="9" y="40" width="3" height="4" rx="1" fill="#9a84d6"/><rect x="32" y="40" width="3" height="4" rx="1" fill="#9a84d6"/>
      <path d="M41 4 V13" stroke="#1f7a78" stroke-width="1.8" stroke-linecap="round"/>
      <ellipse cx="38.6" cy="13.4" rx="2.6" ry="2" fill="#1f7a78"/>
      <path d="M41 4 Q45 5 45.5 8.5" stroke="#1f7a78" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </svg>Keys-n-Ears</a>
    <span id="midi-status" class="status">Connecting MIDI…</span>
    <div class="controls">
      <select id="input-select" aria-label="MIDI input"></select>
      <select id="output-select" aria-label="Prompts output"></select>
      <details class="genres">
        <summary id="genre-summary">Genres: All</summary>
        <div id="genre-list" class="genre-list"></div>
      </details>
    </div>
  </header>

  <main id="view"></main>

  <script src="https://cdn.jsdelivr.net/npm/tone@15.0.4/build/Tone.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
